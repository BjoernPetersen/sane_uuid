name: sane_uuid
description: >
  A sane UUID implementation with support for generating and handling v1, v4 and v5 UUIDs according to RFC4122.
version: 1.1.0
homepage: https://github.com/BjoernPetersen/sane_uuid

environment:
  sdk: '3.13.3'

dependencies:
  # Static analysis
  meta: ^1.3.0

  # Hashing functions for v5 UUIDs
  crypto: 3.0.7

dev_dependencies:
  test: 1.32.0

  # Static analysis
  lints: 6.1.0
